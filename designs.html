<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadia's Tattoo Designs - Fine Line, Cute & Small Tattoos</title>
    <meta name="description" content="Browse Nadia's tattoo designs: fine line, cute small tattoos, flowers, animals and dragon designs before sending a tattoo inquiry.">

    <meta property="og:title" content="Nadia's Tattoo Designs - Fine Line, Cute & Small Tattoos">
    <meta property="og:description" content="Browse Nadia's tattoo designs: fine line, cute small tattoos, flowers, animals and dragon designs before sending a tattoo inquiry.">

    <link rel="stylesheet" href="style.css?v=93">
    <script src="cookies.js"></script>
</head>
<body class="nadia-home-page nadia-designs-page nadia-family-page">
    <header class="nadia-home-header">
        <div class="nadia-home-grid" aria-hidden="true"></div>

        <a class="nadia-logo-link" href="index.html" aria-label="Nadia's Tattoo Designs home">
            <span class="nadia-designs-logo-text">Tattoo<br>Designs</span>
        </a>

        <nav class="nadia-main-nav" aria-label="Main navigation">
            <img
                class="nadia-nav-art"
                src="images/nadia-identity/nav-bar.png"
                alt=""
                aria-hidden="true"
            >

            <span class="nadia-nav-links">
                <a href="designs.html">Tattoos</a>
                <a href="shop/index.html">Shop</a>
                <a href="index.html#about">About me</a>
                <a href="index.html#contact">Contact</a>
            </span>
        </nav>

        <div class="nadia-mobile-actions" aria-label="Quick actions">
            <a href="designs.html" aria-label="Open tattoos">
                <img src="images/nadia-identity/lupa.png" alt="">
            </a>
            <a href="shop/index.html" aria-label="Open shop">
                <img src="images/nadia-identity/cart.png" alt="">
            </a>
        </div>
    </header>
    <main class="page-shell">
        <section class="hero try-on-hero dragon-select-hero designs-hub">
            <div class="dragon-actions nadia-top-action">
                <a href="https://booking.nakutattoo.com/inquiry/" class="cta-button" onclick="trackNakuEvent('DesignsInquiryClick');">
                    Send tattoo inquiry
                </a>
            </div>

            <div class="dragon-grid">
                <a class="dragon-card" href="try-on/simple.html" onclick="trackNakuEvent('DesignsSimpleClick');">

                    <span>Simple</span>
                </a>

                <a class="dragon-card" href="try-on/botanical.html" onclick="trackNakuEvent('DesignsBotanicalClick');">
                    <img src="images/botanical/botanical-01.png" alt="Floral tattoo designs">
                    <span>Floral</span>
                </a>

                <a class="dragon-card" href="try-on/dragons.html" onclick="trackNakuEvent('DesignsDragonsClick');">
                    <img src="images/dragons/dragon-01.png" alt="Dragon tattoo designs">
                    <span>Dragons</span>
                </a>
            </div>
        </section>
    </main>

    <script>
        trackNakuEvent("DesignsPageView");
    </script>
