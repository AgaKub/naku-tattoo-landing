<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon try-on — Naku Tattoo</title>
    <meta name="description" content="Choose a little dragon and try it on through your phone camera.">
    <link rel="stylesheet" href="../style.css?v=93">
    <script src="../cookies.js"></script>
</head>
<body>
    <main class="page-shell">
        <section class="hero try-on-hero">
            <p class="eyebrow">Naku Tattoo Try-On</p>

            <h1>
                Choose your little dragon 🐉
            </h1>

            <p>
                Pick one dragon and see how it feels on your skin through your phone camera.
            </p>

            <div class="dragon-grid">
                <a class="dragon-card" href="manual.html?design=dragon-01" onclick="trackNakuEvent('DragonTryOnClick01');">
                    <img src="../images/dragons/dragon-01.png" alt="Dragon tattoo design 1">
                    <span>Open try-on</span>
                </a>

                <a class="dragon-card" href="manual.html?design=dragon-02" onclick="trackNakuEvent('DragonTryOnClick02');">
                    <img src="../images/dragons/dragon-02.png" alt="Dragon tattoo design 2">
                    <span>Open try-on</span>
                </a>

                <a class="dragon-card" href="manual.html?design=dragon-03" onclick="trackNakuEvent('DragonTryOnClick03');">
                    <img src="../images/dragons/dragon-03.png" alt="Dragon tattoo design 3">
                    <span>Open try-on</span>
                </a>
            </div>

            <p class="guest-spot-description">
                This is a soft preview only. Nadia will help with the final size, placement and flow.
            </p>

            <a href="https://booking.nakutattoo.com/inquiry/" class="cta-button" onclick="trackNakuEvent('DragonInquiryClick');">
                Send tattoo inquiry
            </a>

            <a href="../index.html" class="secondary-link">
                Back to Naku Tattoo
            </a>
        </section>
    </main>

    <script>
        trackNakuEvent("DragonTryOnPageView");
    </script>
</body>
</html>
