<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tattoo try-on — Naku Tattoo</title>
    <meta name="description" content="Naku Tattoo by Nadia Kubczak — small tattoos, fine line tattoo designs, cute creatures and custom tattoos in Warsaw, with guest spots in selected cities.">

    <meta property="og:title" content="Tattoo try-on — Naku Tattoo">
    <meta property="og:description" content="Choose a design family and see how it feels on your skin.">
    
    <meta name="twitter:title" content="Tattoo try-on — Naku Tattoo">
    <meta name="twitter:description" content="Choose a design family and see how it feels on your skin.">   

    <link rel="stylesheet" href="../style.css?v=93">
    <script src="../cookies.js"></script>
</head>
<body>
    <main class="page-shell">
        <section class="hero try-on-hero dragon-select-hero">
            <p class="eyebrow">Naku Tattoo Try-On</p>

            <h1>
                Choose a design family
            </h1>

            <p>
                Pick a small collection and try a tattoo preview on your body through your phone camera.
            </p>

            <div class="dragon-grid">
                <a class="dragon-card" href="dragons.html" onclick="trackNakuEvent('TryOnHubDragonsClick');">
                    <img src="../images/dragons/dragon-01.png" alt="Dragon tattoo designs">
                    <span>Dragons</span>
                </a>

                <a class="dragon-card" href="simple.html" onclick="trackNakuEvent('TryOnHubSimpleClick');">
                    <img src="../images/simple/simple-01.png" alt="Simple tattoo designs">
                    <span>Simple little designs</span>
                </a>

                <a class="dragon-card" href="botanical.html" onclick="trackNakuEvent('TryOnHubBotanicalClick');">
                    <img src="../images/botanical/botanical-01.png" alt="Botanical tattoo designs">
                    <span>Botanical designs</span>
                </a>
            </div>

            <p class="guest-spot-description">
                More design families can be added later as Nadia prepares new collections.
            </p>

            <div class="dragon-actions">
                <a href="https://booking.nakutattoo.com/inquiry/" class="cta-button" onclick="trackNakuEvent('TryOnHubInquiryClick');">
                    Send tattoo inquiry
                </a>

                <a href="../index.html" class="secondary-link">
                    Back to Naku Tattoo
                </a>
            </div>
        </section>
    </main>

    <script>
        trackNakuEvent("TryOnHubPageView");
    </script>
</body>
</html>
