<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botanical tattoo try-on — Naku Tattoo</title>
    <meta name="description" content="Choose a botanical tattoo design and try it on through your phone camera.">
    <link rel="stylesheet" href="../style.css?v=93">
    <script src="../cookies.js"></script>
</head>
<body>
    <main class="page-shell">
        <section class="hero try-on-hero dragon-select-hero">
            <p class="eyebrow">Naku Tattoo Try-On</p>

            <h1>
                Choose a botanical design
            </h1>

            <p>
                Pick one plant-inspired tattoo design and see how it feels on your skin through your phone camera.
            </p>

            <div class="dragon-grid">
                <a class="dragon-card" href="manual.html?design=botanical-01" onclick="trackNakuEvent('BotanicalTryOnClick01');">
                    <img src="../images/botanical/botanical-01.png" alt="Botanical tattoo design 1">
                    <span>Open try-on</span>
                </a>

                <a class="dragon-card" href="manual.html?design=botanical-02" onclick="trackNakuEvent('BotanicalTryOnClick02');">
                    <img src="../images/botanical/botanical-02.png" alt="Botanical tattoo design 2">
                    <span>Open try-on</span>
                </a>
            </div>

            <p class="guest-spot-description">
                This is a soft preview only. Nadia will help with the final size, placement and flow.
            </p>

            <div class="dragon-actions">
                <a href="https://booking.nakutattoo.com/inquiry/" class="cta-button" onclick="trackNakuEvent('BotanicalInquiryClick');">
                    Send tattoo inquiry
                </a>

                <a href="../index.html" class="secondary-link">
                    Back to Naku Tattoo
                </a>
            </div>
        </section>
    </main>

    <script>
        trackNakuEvent("BotanicalTryOnPageView");
    </script>
</body>
</html>
